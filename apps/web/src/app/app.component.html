<div class="shell" *transloco="let t">
  <header class="topbar">
    <a routerLink="/" class="brand">{{ t('app.brand') }}</a>
    <div class="topbar-actions">
      <nav class="nav">
        <a routerLink="/status">{{ t('app.nav.status') }}</a>
        @if (auth.user()) {
          <a routerLink="/wallets">{{ t('app.nav.wallets') }}</a>
          <a routerLink="/profile">{{ t('app.nav.profile') }}</a>
          @if (auth.isAdmin()) {
            <a routerLink="/admin">{{ t('app.nav.admin') }}</a>
          }
        } @else {
          <a routerLink="/login">{{ t('app.nav.signIn') }}</a>
        }
      </nav>
      <label class="lang-switch">
        <span class="visually-hidden">{{ t('app.language') }}</span>
        <select
          [attr.aria-label]="t('app.language')"
          [value]="locale.activeLang()"
          (change)="onLangChange($event)"
        >
          @for (lang of locale.langs; track lang.id) {
            <option [value]="lang.id">{{ t(lang.labelKey) }}</option>
          }
        </select>
      </label>
    </div>
  </header>
  <main>
    <router-outlet />
  </main>
</div>
