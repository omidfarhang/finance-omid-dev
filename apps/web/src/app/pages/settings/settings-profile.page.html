<div class="settings-section" *transloco="let t">
  @if (message()) {
    <p-message severity="success" class="block">{{ message() }}</p-message>
  }
  @if (error()) {
    <p-message severity="error" class="block">{{ error() }}</p-message>
  }

  <form (ngSubmit)="saveProfile()" class="panel">
    <div class="panel-header">
      <h2>{{ t('settings.accountDetails') }}</h2>
    </div>
    <label>
      {{ t('settings.displayName') }}
      <input pInputText name="displayName" [(ngModel)]="displayName" required />
    </label>
    <label>
      {{ t('settings.locale') }}
      <p-select
        [options]="localeOptions()"
        [ngModel]="localeService.activeLang()"
        (ngModelChange)="onLocaleChange($event)"
        name="locale"
        optionLabel="label"
        optionValue="value"
        class="w-full"
      />
    </label>
    <label>
      {{ t('settings.timeZone') }}
      <p-select
        [options]="timeZoneOptions"
        [(ngModel)]="timeZone"
        name="timeZone"
        optionLabel="label"
        optionValue="value"
        [filter]="true"
        [showClear]="true"
        [placeholder]="t('settings.timeZoneUnset')"
        class="w-full"
      />
    </label>
    <label>
      {{ t('settings.calendar') }}
      <p-select
        [options]="calendarSelectOptions()"
        [ngModel]="calendar"
        (ngModelChange)="onCalendarChange($event)"
        name="calendar"
        optionLabel="label"
        optionValue="value"
        class="w-full"
      />
    </label>
    <p class="lede">{{ t('settings.calendarLede') }}</p>
    <div class="theme-field">
      <span class="theme-label">{{ t('settings.theme') }}</span>
      <p-selectbutton
        [options]="themeOptions()"
        [ngModel]="theme"
        (ngModelChange)="onThemeChange($event)"
        name="theme"
        optionLabel="label"
        optionValue="value"
        [allowEmpty]="false"
        styleClass="theme-select"
        [attr.aria-label]="t('settings.theme')"
      >
        <ng-template #item let-option>
          <span
            class="theme-option"
            [attr.aria-label]="option.label"
            [attr.title]="option.label"
          >
            <i [class]="option.icon" aria-hidden="true"></i>
          </span>
        </ng-template>
      </p-selectbutton>
      <p class="lede">{{ t('settings.themeLede') }}</p>
    </div>
    <button pButton type="submit" [disabled]="loading()">
      @if (loading()) {
        <i class="pi pi-spinner pi-spin" aria-hidden="true"></i>
      }
      {{ t('settings.save') }}
    </button>
  </form>

  <section class="panel">
    <div class="panel-header">
      <h2>{{ t('settings.moneyDisplayTitle') }}</h2>
    </div>
    <p class="lede">{{ t('settings.moneyDisplayLede') }}</p>
    <label class="checkbox-row">
      <input
        type="checkbox"
        name="showToman"
        [checked]="moneyDisplay.showToman()"
        (change)="onShowTomanChange($any($event.target).checked)"
      />
      <span>{{ t('settings.showToman') }}</span>
    </label>
  </section>
</div>
