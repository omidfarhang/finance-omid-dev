<section class="auth-page" *transloco="let t">
  <h1>{{ t('login.title') }}</h1>
  <p class="lede">{{ t('login.lede') }}</p>

  @if (error()) {
    <p-message severity="error" [text]="error()!" styleClass="block" />
  }

  <form (ngSubmit)="submit()" class="auth-form">
    @if (!pendingToken()) {
      <label>
        {{ t('login.email') }}
        <input pInputText type="email" name="email" [(ngModel)]="email" required autocomplete="username" />
      </label>
      <label>
        {{ t('login.password') }}
        <p-password
          [(ngModel)]="password"
          name="password"
          [feedback]="false"
          toggleMask
          required
          autocomplete="current-password"
          styleClass="w-full"
          inputStyleClass="w-full"
        />
      </label>
    } @else {
      <p>{{ t('login.totpPrompt') }}</p>
      <label>
        {{ t('login.totpCode') }}
        <input
          pInputText
          name="totpCode"
          [(ngModel)]="totpCode"
          required
          inputmode="numeric"
          autocomplete="one-time-code"
        />
      </label>
    }

    <p-button
      type="submit"
      [label]="pendingToken() ? t('login.verify') : t('login.submit')"
      [loading]="loading()"
    />
  </form>

  <p class="footer">
    {{ t('login.noAccount') }}
    <a routerLink="/register">{{ t('login.createOne') }}</a>
  </p>
</section>
