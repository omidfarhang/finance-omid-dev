<section class="auth-page" *transloco="let t">
  <h1>{{ t('login.title') }}</h1>
  <p class="lede">{{ t('login.lede') }}</p>

  @if (error()) {
    <p-message severity="error" class="block">{{ error() }}</p-message>
  }

  <form (ngSubmit)="submit()" class="auth-form">
    @if (!pendingToken()) {
      <label>
        {{ t('login.email') }}
        <input pInputText type="email" name="email" [(ngModel)]="email" required autocomplete="username" />
      </label>
      <label>
        {{ t('login.password') }}
        <p-password
          [(ngModel)]="password"
          name="password"
          [feedback]="false"
          toggleMask
          required
          autocomplete="current-password"
          class="w-full"
          inputStyleClass="w-full"
        />
      </label>
    } @else {
      <p>{{ t('login.totpPrompt') }}</p>
      <label>
        {{ t('login.totpCode') }}
        <input
          pInputText
          name="totpCode"
          [(ngModel)]="totpCode"
          required
          inputmode="numeric"
          autocomplete="one-time-code"
        />
      </label>
    }

    <button pButton type="submit" [disabled]="loading()">
      @if (loading()) {
        <i class="pi pi-spinner pi-spin" aria-hidden="true"></i>
      }
      {{ pendingToken() ? t('login.verify') : t('login.submit') }}
    </button>
  </form>

  @if (registrationAllowed()) {
    <p class="footer">
      {{ t('login.noAccount') }}
      <a routerLink="/register">{{ t('login.createOne') }}</a>
    </p>
  }
</section>
