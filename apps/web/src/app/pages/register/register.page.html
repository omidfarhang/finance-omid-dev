<section class="auth-page" *transloco="let t">
  <h1>{{ t('register.title') }}</h1>
  <p class="lede">{{ t('register.lede') }}</p>

  @if (error()) {
    <p-message severity="error" [text]="error()!" styleClass="block" />
  }

  <form (ngSubmit)="submit()" class="auth-form">
    <label>
      {{ t('register.displayName') }}
      <input pInputText name="displayName" [(ngModel)]="displayName" required autocomplete="name" />
    </label>
    <label>
      {{ t('register.email') }}
      <input pInputText type="email" name="email" [(ngModel)]="email" required autocomplete="username" />
    </label>
    <label>
      {{ t('register.password') }}
      <p-password
        [(ngModel)]="password"
        name="password"
        toggleMask
        required
        autocomplete="new-password"
        styleClass="w-full"
        inputStyleClass="w-full"
      />
    </label>

    <p-button type="submit" [label]="t('register.submit')" [loading]="loading()" />
  </form>

  <p class="footer">
    {{ t('register.alreadyRegistered') }}
    <a routerLink="/login">{{ t('register.signIn') }}</a>
  </p>
</section>
