<section class="status-page" *transloco="let t">
  <h1>{{ t('status.title') }}</h1>
  <p class="lede" [innerHTML]="t('status.lede')"></p>

  @if (ok() === true) {
    <p-message severity="success" [text]="detail()!" styleClass="block" />
  } @else if (ok() === false) {
    <p-message severity="error" [text]="detail()!" styleClass="block" />
  } @else if (loading()) {
    <p-message severity="info" [text]="t('status.checking')" styleClass="block" />
  }

  <div class="actions">
    <p-button
      [label]="t('status.checkAgain')"
      icon="pi pi-refresh"
      [loading]="loading()"
      (onClick)="check()"
    />
    <a routerLink="/login">{{ t('status.signIn') }}</a>
  </div>
</section>
