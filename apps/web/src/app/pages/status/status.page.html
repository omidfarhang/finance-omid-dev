<section class="status-page" *transloco="let t">
  <h1>{{ t('status.title') }}</h1>
  <p class="lede" [innerHTML]="t('status.lede')"></p>

  @if (ok() === true) {
    <p-message severity="success" class="block">{{ detail() }}</p-message>
  } @else if (ok() === false) {
    <p-message severity="error" class="block">{{ detail() }}</p-message>
  } @else if (loading()) {
    <p-message severity="info" class="block">{{ t('status.checking') }}</p-message>
  }

  <div class="actions">
    <button pButton type="button" [disabled]="loading()" (click)="check()">
      @if (loading()) {
        <i class="pi pi-spinner pi-spin" aria-hidden="true"></i>
      } @else {
        <i class="pi pi-refresh" aria-hidden="true"></i>
      }
      {{ t('status.checkAgain') }}
    </button>
    <a routerLink="/settings">{{ t('settings.title') }}</a>
  </div>
</section>
