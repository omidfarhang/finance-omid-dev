<div class="shell app-shell" *transloco="let t">
  <header class="topbar">
    <a routerLink="/" class="brand" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      {{ t('app.brand') }}
    </a>
    <div class="topbar-actions">
      <nav class="nav primary-nav" [attr.aria-label]="t('app.nav.primary')">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          {{ t('app.nav.home') }}
        </a>
        <a routerLink="/activity" routerLinkActive="active">{{ t('app.nav.activity') }}</a>
        <a routerLink="/accounts" routerLinkActive="active">{{ t('app.nav.accounts') }}</a>
        <a routerLink="/import" routerLinkActive="active">{{ t('app.nav.import') }}</a>
        <a routerLink="/outlook" routerLinkActive="active">{{ t('app.nav.outlook') }}</a>
      </nav>
      <app-user-menu />
    </div>
  </header>

  <main class="shell-main">
    <router-outlet />
  </main>

  <nav class="bottom-nav" [attr.aria-label]="t('app.nav.primary')">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      {{ t('app.nav.home') }}
    </a>
    <a routerLink="/activity" routerLinkActive="active">{{ t('app.nav.activity') }}</a>
    <a routerLink="/accounts" routerLinkActive="active">{{ t('app.nav.accounts') }}</a>
    <a routerLink="/import" routerLinkActive="active">{{ t('app.nav.import') }}</a>
    <a routerLink="/outlook" routerLinkActive="active">{{ t('app.nav.outlook') }}</a>
  </nav>
</div>
