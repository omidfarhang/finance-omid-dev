<div class="shell app-shell" *transloco="let t">
  <aside class="side-rail">
    <a routerLink="/" class="brand side-brand" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      {{ t('app.brand') }}
    </a>
    <nav class="nav side-nav" [attr.aria-label]="t('app.nav.primary')">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.exact === true }"
        >
          <span class="nav-icon" aria-hidden="true">
            <app-nav-icon [name]="item.icon" />
          </span>
          <span class="nav-label">{{ t(item.labelKey) }}</span>
        </a>
      }
    </nav>
  </aside>

  <div class="shell-body">
    <header class="topbar">
      <a routerLink="/" class="brand top-brand" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        {{ t('app.brand') }}
      </a>
      <div class="topbar-actions">
        <app-user-menu />
      </div>
    </header>

    <p-confirmdialog />

    <main class="shell-main">
      <router-outlet />
    </main>
  </div>

  <nav class="bottom-nav" [attr.aria-label]="t('app.nav.primary')">
    @for (item of navItems; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.exact === true }"
      >
        <span class="nav-icon" aria-hidden="true">
          <app-nav-icon [name]="item.icon" />
        </span>
        <span class="nav-label">{{ t(item.labelKey) }}</span>
      </a>
    }
  </nav>
</div>
