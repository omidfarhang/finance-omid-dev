<div class="app-date-time-field" *transloco="let t">
  <div
    class="date-strip"
    cdkOverlayOrigin
    #fieldOrigin="cdkOverlayOrigin"
  >
    <button
      pButton
      type="button"
      severity="secondary"
      [iconOnly]="true"
      class="step-btn"
      [disabled]="disabled || !canStepPrev()"
      [attr.aria-label]="t('common.prevDay')"
      (click)="stepDay(-1)"
    >
      <i class="pi pi-chevron-left" aria-hidden="true"></i>
    </button>

    @if (editing()) {
      <input
        #dateInput
        pInputText
        type="text"
        class="date-input"
        [disabled]="disabled"
        [placeholder]="t('common.dateTimePlaceholder')"
        [attr.aria-label]="t('common.pickDateTime')"
        [ngModel]="typedText()"
        (ngModelChange)="onTypedTextInput($event)"
        [ngModelOptions]="{ standalone: true }"
        (blur)="commitTypedText()"
        (keydown)="onTypedKeydown($event)"
      />
    } @else {
      <button
        type="button"
        class="strip-caption"
        [disabled]="disabled"
        [attr.aria-label]="t('common.pickDateTime')"
        (click)="startEditing()"
      >
        {{ stripCaption() }}
      </button>
    }

    <button
      pButton
      type="button"
      severity="secondary"
      [iconOnly]="true"
      class="step-btn"
      [disabled]="disabled || !canStepNext()"
      [attr.aria-label]="t('common.nextDay')"
      (click)="stepDay(1)"
    >
      <i class="pi pi-chevron-right" aria-hidden="true"></i>
    </button>

    <button
      pButton
      type="button"
      severity="secondary"
      [iconOnly]="true"
      class="calendar-toggle"
      [disabled]="disabled"
      [attr.aria-label]="t('common.openCalendar')"
      [attr.aria-expanded]="open()"
      (click)="toggleOpen()"
    >
      <i class="pi pi-calendar" aria-hidden="true"></i>
    </button>
  </div>

  <ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="fieldOrigin"
    [cdkConnectedOverlayOpen]="open()"
    [cdkConnectedOverlayHasBackdrop]="true"
    cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
    [cdkConnectedOverlayPositions]="overlayPositions"
    [cdkConnectedOverlayPush]="true"
    [cdkConnectedOverlayViewportMargin]="8"
    (backdropClick)="closePanel()"
    (overlayKeydown)="onOverlayKeydown($event)"
  >
    <div class="calendar-panel" role="dialog" [attr.aria-label]="t('common.pickDateTime')">
      <div class="calendar-nav">
        <button
          pButton
          type="button"
          severity="secondary"
          size="small"
          [attr.aria-label]="t('common.prevYear')"
          (click)="prevYear()"
        >
          «
        </button>
        <button
          pButton
          type="button"
          severity="secondary"
          size="small"
          [attr.aria-label]="t('common.prevMonth')"
          (click)="prevMonth()"
        >
          ‹
        </button>
        <span class="month-label">{{ monthLabel() }}</span>
        <button
          pButton
          type="button"
          severity="secondary"
          size="small"
          [attr.aria-label]="t('common.nextMonth')"
          (click)="nextMonth()"
        >
          ›
        </button>
        <button
          pButton
          type="button"
          severity="secondary"
          size="small"
          [attr.aria-label]="t('common.nextYear')"
          (click)="nextYear()"
        >
          »
        </button>
      </div>

      <div class="day-grid weekday-row" aria-hidden="true">
        @for (item of weekdayLabels(); track $index) {
          <span class="weekday-cell" [class.day-off]="item.dayOff">{{
            item.label
          }}</span>
        }
      </div>

      <div class="day-grid">
        @for (cell of dayCells(); track $index) {
          @if (cell.day == null) {
            <span class="day-cell empty"></span>
          } @else {
            <button
              type="button"
              class="day-cell"
              [class.day-off]="cell.dayOff"
              [class.is-today]="cell.isToday"
              [class.selected]="cell.day === selectedDay()"
              [disabled]="cell.disabled"
              (click)="selectDay(cell.day)"
            >
              {{ cell.day }}
            </button>
          }
        }
      </div>

      <div class="time-row">
        <label class="time-label">
          {{ t('common.time') }}
          <input
            pInputText
            type="text"
            class="time-input"
            [placeholder]="t('common.timePlaceholder')"
            [ngModel]="timeText()"
            (ngModelChange)="onTimeTextInput($event)"
            [ngModelOptions]="{ standalone: true }"
            (blur)="commitTimeText()"
            (keydown)="onTimeKeydown($event)"
          />
        </label>
      </div>

      <div class="panel-actions">
        @if (canGoToNow()) {
          <button
            pButton
            type="button"
            severity="secondary"
            size="small"
            (click)="goToNow()"
          >
            {{ t('common.goToNow') }}
          </button>
        }
        <button
          pButton
          type="button"
          size="small"
          (click)="closePanel()"
        >
          {{ t('common.done') }}
        </button>
      </div>
    </div>
  </ng-template>
</div>
