name: Feature request
description: Propose a problem and outcome (not an undocumented implementation)
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas follow inbox → backlog → plan → todo. Brainstorm notes are not requirements.
        See [CONTRIBUTING.md](https://github.com/omidfarhang/finance-omid-dev/blob/main/CONTRIBUTING.md) and [docs/vision.md](https://github.com/omidfarhang/finance-omid-dev/blob/main/docs/vision.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What demonstrated need does this address?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: What should become true if this is done well?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Related docs, DECs, MVP sections, or why existing features fall short.
    validations:
      required: false
  - type: checkboxes
    id: non-goals
    attributes:
      label: Checks
      options:
        - label: I checked vision non-goals and the backlog for overlap
          required: false
        - label: I am not attaching real financial records or credentials
          required: true
